services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  picas-fijas-api:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      REDIS_HOST: redis
      PORT: "3000"
    depends_on:
      - redis
  picas-fijas-web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - picas-fijas-api
